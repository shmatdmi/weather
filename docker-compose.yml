services:
  app:
    image: mskweather:latest
    container_name: mskweather
    environment:
      HOST: 0.0.0.0
      PORT: 797
    expose:
      - "797"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:797/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - weather-web

  nginx:
    image: nginx:1.29-alpine
    container_name: mskweather-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "797:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/dcomp/sast/certbot/conf:/etc/letsencrypt:ro
    command:
      - /bin/sh
      - -c
      - |
        (while :; do sleep 6h; nginx -s reload; done) &
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - weather-web

networks:
  weather-web:
    driver: bridge
